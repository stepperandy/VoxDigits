# Build VoxVPN iOS IPA — copy this file to .github/workflows/build-ipa.yml
#
# The Base44 GitHub sync app cannot write under .github/workflows/, so this
# template lives in src/scripts/. Move it into place once:
#   mkdir -p .github/workflows && cp src/scripts/build-ipa-ci.yml .github/workflows/build-ipa.yml
#   git add .github/workflows/build-ipa.yml && git commit && git push
#
# Then trigger: Actions → Run workflow, or push a tag `ipa-*.

name: Build VoxVPN iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'ipa-*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Archive (unsigned, for inspection)
        run: |
          xcodebuild \
            -workspace src/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VoxVPN.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.voxvpn.mobile \
            MARKETING_VERSION=2.0.1 \
            CURRENT_PROJECT_VERSION=4 \
            archive | xcpretty

      - name: Package .app for inspection
        run: |
          mkdir -p staging
          cp -R build/VoxVPN.xcarchive/Products/Applications/VoxVPN.app staging/VoxVPN.app
          codesign -d --entitlements - staging/VoxVPN.app 2>/dev/null > staging/VoxVPN.entitlements.txt || true
          plutil -p staging/VoxVPN.app/Info.plist > staging/App-Info.plist.txt
          if [ -d "staging/VoxVPN.app/PlugIns" ]; then
            ls -la staging/VoxVPN.app/PlugIns > staging/PlugIns.txt
          else
            echo "No PlugIns (Packet Tunnel .appex) — see CI_IPA_BUILD.md to add the Tunnel target" > staging/PlugIns.txt
          fi
          cd staging && zip -r ../VoxVPN-inspect.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: VoxVPN-ipa-inspect
          path: |
            VoxVPN-inspect.zip
            build/VoxVPN.xcarchive
          retention-days: 14