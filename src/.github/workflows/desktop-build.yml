name: VoxVPN Desktop V3.0 — Build & Release

on:
  workflow_dispatch:
  push:
    branches: [main, voxvpn-windows-v3-release]
    tags: ['v3.*']

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Prepare VoxVPN Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer/windows/assets" | Out-Null
          Invoke-WebRequest -Uri "https://media.base44.com/images/public/69c84f61d5543b54fe26e1e5/13431de73_VoxICON.png" -OutFile "installer/windows/assets/VoxICON.png"
          choco install imagemagick --no-progress -y
          $magick = (Get-Command magick.exe -ErrorAction SilentlyContinue).Source
          if (!$magick) { throw "ImageMagick was not installed" }
          & $magick "installer/windows/assets/VoxICON.png" -background none -define icon:auto-resize=256,128,64,48,32,16 "installer/windows/assets/icon.ico"
          if (!(Test-Path "installer/windows/assets/icon.ico")) { throw "icon.ico was not produced" }

      - name: Install Electron dependencies
        working-directory: src/electron
        run: npm install

      - name: Build unpacked Windows Electron app
        working-directory: src/electron
        run: npx electron-builder --win --x64 --dir

      - name: Stage Electron output for Inno Setup
        shell: pwsh
        run: |
          $source = "installer/voxshield/output/win-unpacked"
          $target = "installer/windows/dist/win-unpacked"
          if (!(Test-Path $source)) { throw "Missing electron-builder output: $source" }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$source/*" $target -Recurse -Force
          if (!(Test-Path "$target/VoxVPN Shield Agent.exe")) { throw "VoxVPN Shield Agent.exe was not produced" }

      - name: Download OpenVPN Community MSI
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://swupdate.openvpn.org/community/releases/OpenVPN-2.7.7-I001-amd64.msi" -OutFile "installer/windows/assets/OpenVPN-2.7.7-I001-amd64.msi"
          if (!(Test-Path "installer/windows/assets/OpenVPN-2.7.7-I001-amd64.msi")) { throw "OpenVPN MSI download failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile production installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/windows/VoxVPN.iss"
          if (!(Test-Path "installer/windows/output/VoxVPN-Shield-Setup-3.0.0.exe")) { throw "Installer was not produced" }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxVPN-Shield-Setup-3.0.0
          path: src/installer/windows/output/VoxVPN-Shield-Setup-3.0.0.exe

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v3.')
        uses: softprops/action-gh-release@v2
        with:
          name: VoxVPN ${{ github.ref_name }}
          body: |
            # VoxVPN Shield Agent ${{ github.ref_name }}

            Production Windows desktop release.

            ## Included
            - VoxVPN desktop application for Windows 10/11 x64
            - OpenVPN Community Edition and required network drivers
            - VoxVPN account authentication
            - Dynamic server and OpenVPN profile retrieval from the VoxVPN backend
            - System tray integration
            - Kill switch
            - DNS protection
            - Auto-start option
            - Update checking

            Download `VoxVPN-Shield-Setup-3.0.0.exe` below and run it as Administrator.
          files: src/installer/windows/output/VoxVPN-Shield-Setup-3.0.0.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
