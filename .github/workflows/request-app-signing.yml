name: Request App Signing

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to sign
        required: true
        type: choice
        options:
          - android
          - ios
      artifact_url:
        description: Short-lived HTTPS URL for the unsigned APK, AAB, or IPA
        required: true
        type: string
      credentials_url:
        description: Short-lived HTTPS URL for the age-encrypted credentials archive
        required: true
        type: string
      callback_url:
        description: Optional HTTPS callback URL
        required: false
        type: string

permissions:
  contents: read

jobs:
  request-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Select signing endpoint
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          IOS_SIGNING_SERVICE: ${{ secrets.IOS_SIGNING_SERVICE }}
          ANDROID_SIGNING_SERVICE: ${{ secrets.ANDROID_SIGNING_SERVICE }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = "ios" ]; then
            ENDPOINT="$IOS_SIGNING_SERVICE"
          else
            ENDPOINT="$ANDROID_SIGNING_SERVICE"
          fi
          test -n "$ENDPOINT"
          echo "ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"

      - name: Submit authenticated signing request
        shell: bash
        env:
          SIGNING_SERVICE_TOKEN: ${{ secrets.SIGNING_SERVICE_TOKEN }}
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          CREDENTIALS_URL: ${{ inputs.credentials_url }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_SERVICE_TOKEN"
          PAYLOAD="$(jq -n \
            --arg job_id "$JOB_ID" \
            --arg artifact_url "$ARTIFACT_URL" \
            --arg credentials_url "$CREDENTIALS_URL" \
            --arg callback_url "$CALLBACK_URL" \
            '{job_id:$job_id,artifact_url:$artifact_url,credentials_url:$credentials_url} + (if $callback_url == "" then {} else {callback_url:$callback_url} end)')"

          curl --fail-with-body --silent --show-error \
            --request POST "$ENDPOINT" \
            --header "Authorization: Bearer $SIGNING_SERVICE_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD"
