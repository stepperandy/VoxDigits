name: VoxVPN Android v2.5.6 Production Release

on:
  push:
    branches: [voxvpn-android-v2.5.6-installer]
  workflow_dispatch:

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Apply Android v2.5.6 release configuration
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path('src/android/app/src/main/java/com/voxvpn/mobile/MainActivity.kt')
          text = main.read_text(encoding='utf-8')
          servers = '''private val SERVERS = listOf(
              VpnServer("Dallas",      "United States", "🇺🇸"),
              VpnServer("Chicago",     "United States", "🇺🇸"),
              VpnServer("New York",    "United States", "🇺🇸"),
              VpnServer("Los Angeles", "United States", "🇺🇸"),
              VpnServer("Miami",       "United States", "🇺🇸"),
              VpnServer("Toronto",     "Canada",        "🇨🇦"),
              VpnServer("São Paulo",   "Brazil",        "🇧🇷"),
              VpnServer("London",      "United Kingdom","🇬🇧"),
              VpnServer("Paris",       "France",        "🇫🇷"),
              VpnServer("Frankfurt",   "Germany",       "🇩🇪"),
              VpnServer("Mumbai",      "India",         "🇮🇳"),
              VpnServer("Singapore",   "Singapore",     "🇸🇬"),
              VpnServer("Tokyo",       "Japan",         "🇯🇵"),
          )'''
          text, count = re.subn(r'private val SERVERS = listOf\([\s\S]*?\n\)', servers, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace SERVERS block')
          main.write_text(text, encoding='utf-8')

          gradle_file = Path('src/android/app/build.gradle')
          g = gradle_file.read_text(encoding='utf-8')
          if 'namespace "com.voxvpn.mobile"' not in g:
              g = g.replace('android {', 'android {\n    namespace "com.voxvpn.mobile"', 1)
          g = re.sub(r'versionCode\s+\d+', 'versionCode 4', g, count=1)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "2.5.6"', g, count=1)
          g = re.sub(r"kotlinCompilerExtensionVersion\s+'[^']+'", "kotlinCompilerExtensionVersion '1.5.8'", g, count=1)
          g = g.replace("implementation 'androidx.compose.material.icons:material-icons-extended'", "implementation 'androidx.compose.material:material-icons-extended:1.6.1'")
          gradle_file.write_text(g, encoding='utf-8')

          plugin = Path('src/android/app/src/main/java/com/voxvpn/mobile/VoxVpnPlugin.kt')
          if plugin.exists():
              plugin.unlink()

      - name: Decode production signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 secret is missing" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src/android/app/voxvpn-release.keystore

      - name: Build signed release APK and AAB
        working-directory: src/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD secret is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD secret is missing" && exit 1)
          gradle clean assembleRelease bundleRelease --no-daemon

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp src/android/app/build/outputs/apk/release/app-release.apk dist/VoxVPN-Android-v2.5.6-13-Servers-Release.apk
          cp src/android/app/build/outputs/bundle/release/app-release.aab dist/VoxVPN-Android-v2.5.6-13-Servers-PlayStore.aab
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload production Android release
        uses: actions/upload-artifact@v4
        with:
          name: VoxVPN-Android-v2.5.6-Production
          path: dist/
          if-no-files-found: error
          retention-days: 90
