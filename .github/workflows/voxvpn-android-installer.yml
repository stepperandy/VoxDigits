name: VoxVPN Android v2.5.6 Installer

on:
  push:
    branches: [voxvpn-android-v2.5.6-installer]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Apply Android v2.5.6 server list and version
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path('src/android/app/src/main/java/com/voxvpn/mobile/MainActivity.kt')
          text = main.read_text(encoding='utf-8')
          servers = '''private val SERVERS = listOf(
              VpnServer("Dallas",      "United States", "🇺🇸"),
              VpnServer("Chicago",     "United States", "🇺🇸"),
              VpnServer("New York",    "United States", "🇺🇸"),
              VpnServer("Los Angeles", "United States", "🇺🇸"),
              VpnServer("Miami",       "United States", "🇺🇸"),
              VpnServer("Toronto",     "Canada",        "🇨🇦"),
              VpnServer("São Paulo",   "Brazil",        "🇧🇷"),
              VpnServer("London",      "United Kingdom","🇬🇧"),
              VpnServer("Paris",       "France",        "🇫🇷"),
              VpnServer("Frankfurt",   "Germany",       "🇩🇪"),
              VpnServer("Mumbai",      "India",         "🇮🇳"),
              VpnServer("Singapore",   "Singapore",     "🇸🇬"),
              VpnServer("Tokyo",       "Japan",         "🇯🇵"),
          )'''
          text, count = re.subn(r'private val SERVERS = listOf\([\s\S]*?\n\)', servers, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace SERVERS block')
          main.write_text(text, encoding='utf-8')

          gradle_file = Path('src/android/app/build.gradle')
          g = gradle_file.read_text(encoding='utf-8')
          if 'namespace "com.voxvpn.mobile"' not in g:
              g = g.replace('android {', 'android {\n    namespace "com.voxvpn.mobile"', 1)
          g = re.sub(r'versionCode\s+\d+', 'versionCode 4', g, count=1)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "2.5.6"', g, count=1)
          g = g.replace("implementation 'androidx.compose.material.icons:material-icons-extended'", "implementation 'androidx.compose.material:material-icons-extended:1.6.1'")
          gradle_file.write_text(g, encoding='utf-8')

      - name: Build installable APK
        working-directory: src/android
        run: gradle clean assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp src/android/app/build/outputs/apk/debug/app-debug.apk dist/VoxVPN-Android-v2.5.6-13-Servers.apk

      - name: Upload Android installer
        uses: actions/upload-artifact@v4
        with:
          name: VoxVPN-Android-v2.5.6-13-Servers
          path: dist/VoxVPN-Android-v2.5.6-13-Servers.apk
          if-no-files-found: error
